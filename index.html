<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Series | Megan Judge</title>
    <meta property="og:title" content="Favourite Series | Megan Judge">
    <meta property="twitter:title" content="Favourite Series | Megan Judge">
    <meta property="og:site_name" content="Favourite Series | Megan Judge">
    <meta property="og:description" content="Megan Judge's Favourite Video Series.">
    <meta property="og:image" content="https://series.jdge.cc/images/series_logo.png">
    <meta property="og:url" content="https://series.jdge.cc/">
    <meta property="og:locale" content="en_AU">
    <meta property="og:type" content="website">
    <meta name="author" content="Megan Judge">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ff9329">
    <link rel="icon" type="image/png" href="https://series.jdge.cc/images/series_logo.png">
    <link rel="alternate" href="https://series.jdge.cc/" hreflang="en">
    <link rel="canonical" href="https://series.jdge.cc/">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="app-shell">
    <header class="app-header">
        <div class="intro">
            <h1>Megan Judge's Favourite Series</h1>
        </div>

        <nav class="view-tabs" aria-label="View">
            <button type="button" id="filtersTab" class="view-tab" aria-expanded="false" aria-controls="filterPanel">Filters</button>
        </nav>

        <section id="filterPanel" class="filter-bar" aria-label="Filter series" hidden>
            <div class="dropdown-container">
                <label class="sr-only" for="genreDropdown">Filter by genre</label>
                <select id="genreDropdown">
                    <option value="">All Genres</option>
                </select>
                <label class="sr-only" for="countryDropdown">Filter by country</label>
                <select id="countryDropdown">
                    <option value="">All Countries</option>
                </select>
                <label class="sr-only" for="yearDropdown">Filter by year</label>
                <select id="yearDropdown">
                    <option value="">All Years</option>
                </select>
            </div>
            <div id="genreDescription" class="description"></div>
        </section>
    </header>

    <main class="app-content">
        <section class="grid-section" aria-label="Series grid">
            <div id="seriesGrid" class="series-grid">
            </div>
            <p id="noResults" class="empty-state" hidden>No series found for this filter.</p>
        </section>

        <footer class="footer">
            <p>&copy; 2025 Megan Judge</p>
        </footer>
    </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
