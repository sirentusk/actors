<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Actors | Megan Judge</title>
    <meta property="og:title" content="Favourite Actors | Megan Judge">
    <meta property="twitter:title" content="Favourite Actors | Megan Judge">
    <meta property="og:site_name" content="Favourite Actors | Megan Judge">
    <meta property="og:description" content="Megan Judge's Favourite Actors, plotted as a star chart. Actors that, if are in a show, I am more likely to watch it. My choices are unreflective of their personal lives - as I don't generally know anything about them.">
    <meta property="og:image" content="https://actors.jdge.cc/images/actors_logo.png">
    <meta property="og:url" content="https://actors.jdge.cc">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_AU">
    <meta name="theme-color" content="#190033">
    <meta name="author" content="Megan Judge">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" href="images/actors_logo.png">
    <link rel="alternate" href="https://actors.jdge.cc/" hreflang="en">
    <link rel="canonical" href="https://actors.jdge.cc/">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="credit">Megan Judge</div>

    <canvas id="starfield" aria-hidden="true"></canvas>

    <main class="cosmos">
        <div class="stage" id="stage">
            <svg class="arcs" id="arcs" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="medallion">
                <span class="eyebrow">A catalogue, plotted as sky</span>
                <h1>Megan Judge&rsquo;s<br>Favourite Actors</h1>
                <span class="stat">39 actors &middot; 66 favourites</span>
            </div>
        </div>
    </main>

    <p class="hint" id="hint">Tap a star to see their favourites</p>

    <div class="overlay" id="overlay">
        <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-name">
            <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
            <div class="card-portrait" id="cardPortrait"></div>
            <h2 class="card-name" id="card-name"></h2>
            <div class="card-links" id="cardLinks"></div>
            <div class="eyebrow-label">Favourites</div>
            <ul class="fav-list" id="cardFavs"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
